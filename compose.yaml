services:
  mariadb:
    image: mariadb:11.4
    container_name: tabla-personas-db

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./src/main/resources/es/ivanalonsof/tablapersonas/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  mariadb_data: